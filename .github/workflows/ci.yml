name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod

      - name: Run Unit Tests
        run: make unit-test

      - name: Build Binary
        run: make build

      - name: Run Smoke Tests
        run: CODEX_MP=./codex-mp ./tests/smoke.sh

      - name: Run Battle Tests
        run: CODEX_MP=./codex-mp ./tests/battle.sh

      - name: Run Concurrency Tests
        run: CODEX_MP=./codex-mp ./tests/concurrency_test.sh

      - name: Run Corrupt Storage Tests
        run: CODEX_MP=./codex-mp ./tests/corrupt_storage_test.sh

  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: make shell-lint

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: go
          version: v2.12.1
